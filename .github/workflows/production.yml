name: Build & Upload to App Store
on: [workflow_dispatch]

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploying to App Store
    runs-on: macOS-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Install WASM build tools
        run: brew install lld

      - name: Verify wasm-ld installation
        run: |
          echo "Checking wasm-ld location..."
          which wasm-ld || echo "wasm-ld not found in PATH"
          ls -la /opt/homebrew/bin/wasm-ld 2>/dev/null || echo "wasm-ld not in /opt/homebrew/bin"
          ls -la /usr/local/bin/wasm-ld 2>/dev/null || echo "wasm-ld not in /usr/local/bin"
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          which wasm-ld && echo "wasm-ld found after PATH update"

      - name: Deploy production build to App Store via Fastlane
        run: |
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          echo "$MATCH_DEPLOY_KEY" > ~/.ssh/id_rsa && chmod 600 ~/.ssh/id_rsa && fastlane beta
        env:
          MATCH_DEPLOY_KEY: "${{ secrets.MATCH_DEPLOY_KEY }}"
          APP_STORE_CONNECT_TEAM_ID: "${{ secrets.APP_STORE_CONNECT_TEAM_ID }}"
          DEVELOPER_APP_ID: "${{ secrets.DEVELOPER_APP_ID }}"
          DEVELOPER_APP_IDENTIFIER: "${{ secrets.DEVELOPER_APP_IDENTIFIER }}"
          DEVELOPER_APP_EXTENSION_IDENTIFIER: "${{ secrets.DEVELOPER_APP_EXTENSION_IDENTIFIER }}"
          DEVELOPER_PORTAL_TEAM_ID: "${{ secrets.DEVELOPER_PORTAL_TEAM_ID }}"
          FASTLANE_APPLE_ID: "${{ secrets.FASTLANE_APPLE_ID }}"
          FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD: "${{ secrets.FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD }}"
          MATCH_PASSWORD: "${{ secrets.MATCH_PASSWORD }}"
          GIT_AUTHORIZATION: "${{ secrets.GIT_AUTHORIZATION }}"
          PROVISIONING_PROFILE_SPECIFIER: "${{ secrets.PROVISIONING_PROFILE_SPECIFIER }}"
          TEMP_KEYCHAIN_PASSWORD: "${{ secrets.TEMP_KEYCHAIN_PASSWORD }}"
          TEMP_KEYCHAIN_USER: "${{ secrets.TEMP_KEYCHAIN_USER }}"
          APPLE_KEY_ID: "${{ secrets.APPLE_KEY_ID }}"
          APPLE_ISSUER_ID: "${{ secrets.APPLE_ISSUER_ID }}"
          APPLE_KEY_CONTENT: "${{ secrets.APPLE_KEY_CONTENT }}"
          JUDGE0_KEY: "${{ secrets.JUDGE0_KEY }}"
          JUDGE0_ENDPOINT: "${{ secrets.JUDGE0_ENDPOINT }}"
          DISTRIBUTE_EXTERNAL: "false"
          XCODE_PATH: "/Applications/Xcode_26.2.app"
