[package]
name = "wasmer-ios"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib"]

[features]
# Enables the Cranelift compiling engine + AOT artifact cache when the host
# allows JIT (simulator/macOS/JIT-entitled device). Devices without JIT always
# fall back to the interpreter at runtime regardless of this feature.
default = ["cranelift"]
cranelift = ["wasmer/cranelift"]

[dependencies]
wasmer = { path = "./wasmer/lib/api", default-features = false, features = ["wasmi-default", "cranelift"] }
wasmer7 = { package = "wasmer", version = "7.1.0", default-features = false, features = ["sys", "cranelift"] }
wasmer-wasix = { version = "0.701.0", features = ["sys-default"] }
tokio = { version = "1", features = ["rt", "sync"] }
libc = "0.2.186"
nix = { version = "0.27", features = ["fs"] }

[patch.crates-io]
wasmer = { path = "./wasmer/lib/api" }
wasmer-types = { path = "./wasmer/lib/types" }
wasmer-vm = { path = "./wasmer/lib/vm" }
wasmer-compiler = { path = "./wasmer/lib/compiler" }
wasmer-derive = { path = "./wasmer/lib/derive" }

[profile.release]
opt-level = "z"     # Optimize for size
lto = false         # Avoid iOS staticlib bitcode/LTO duplicate-symbol issues
codegen-units = 1   # Better optimization
debug = 0           # Do not emit debug info into archive members
incremental = false # Keep release builds deterministic and compact
panic = "abort"     # Remove unwinding tables from the iOS static library
strip = "symbols"   # Strip symbols where rustc can do so directly
